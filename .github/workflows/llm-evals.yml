# LLM evals: guardrail tests -> start an LLM -> build the index -> run the eval gate
name: LLM evals

on:
  push:
    branches: [main]
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Guardrail tests (fast, no LLM needed)
        run: python -m pytest tests/test_guardrails.py

      - name: Install Ollama
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and download the models
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -s http://127.0.0.1:11434 > /dev/null && break; sleep 2; done
          ollama pull llama3.2
          ollama pull nomic-embed-text

      - name: Build the index
        run: python build_index.py

      - name: Run the evals (the eval gate)
        run: python run_evals.py